# verify_jwt = false means the function can be invoked publicly (no auth header
# needed). Every function below is either called from the browser (the WIP video
# one) or called by Supabase's own pg_cron scheduler from inside the database,
# neither of which carry a user JWT. The functions still do their OWN auth where
# it matters (e.g. they use the service-role key internally to write to tables).

[functions.get-latest-wip-video]
verify_jwt = false

[functions.extract-wip-guests]
verify_jwt = false

[functions.fetch-farcaster-casts]
verify_jwt = false

[functions.fetch-twitter-posts]
verify_jwt = false