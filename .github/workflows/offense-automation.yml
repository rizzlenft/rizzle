name: Offense Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "22 14 * * *"

jobs:
  seo-offense:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with SEO postbuild
        run: npm run build

      - name: Run SEO smoke checks
        run: npm run seo:smoke

      - name: Submit IndexNow URLs
        run: npm run indexnow:submit || echo "::warning::IndexNow submission failed; continuing."

      - name: Live SEO verification
        run: npm run seo:live-smoke || echo "::warning::Live SEO verification failed; continuing."
