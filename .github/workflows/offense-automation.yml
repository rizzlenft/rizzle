name: Offense Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "22 14 * * *"

jobs:
  seo-offense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with SEO postbuild
        run: npm run build

      - name: Run SEO smoke checks
        run: npm run seo:smoke

      - name: Submit IndexNow URLs
        run: npm run indexnow:submit
        continue-on-error: true
